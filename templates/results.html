<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Results - Student Success Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 2rem 0; }
        .card { box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .success { color: #198754; }
        .warning { color: #ffc107; }
        .danger { color: #dc3545; }
        #chartContainer { height: 300px; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Prediction Results</h3>
                    </div>
                    <div class="card-body text-center">
                        <div id="resultBody">
                            <h4 class="mb-4">Student is <span id="predictionStatus" class="fw-bold"></span></h4>
                            <p class="h5 mb-4">Confidence: <span id="predictionConfidence" class="fw-bold"></span>%</p>

                            <div id="chartContainer">
                                <canvas id="predictionChart"></canvas>
                            </div>
                        </div>

                        <div id="missingData" class="alert alert-warning d-none" role="alert">
                            No prediction to show. Start from the form to make one.
                        </div>

                        <div class="mt-4">
                            <a href="/" class="btn btn-primary">Make Another Prediction</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Labels are in the model's class order, so probabilities[i] belongs to
        // LABELS[i]. Changing one without the other silently mislabels the chart.
        const LABELS = ['Dropout', 'Graduate', 'Enrolled'];
        const COLORS = ['#dc3545', '#198754', '#ffc107'];

        const params = new URLSearchParams(window.location.search);
        const prediction = params.get('prediction');
        const confidence = params.get('confidence');
        const probabilities = (params.get('probabilities') || '')
            .split(',')
            .map(Number);

        const hasResult =
            LABELS.includes(prediction) &&
            confidence !== null &&
            probabilities.length === LABELS.length &&
            probabilities.every(Number.isFinite);

        // Someone can land here with no query string, from a bookmark or a
        // shared link. Show the empty state rather than a half rendered page.
        if (!hasResult) {
            document.getElementById('resultBody').classList.add('d-none');
            document.getElementById('missingData').classList.remove('d-none');
        } else {
            const statusElement = document.getElementById('predictionStatus');
            const confidenceElement = document.getElementById('predictionConfidence');

            statusElement.textContent = `Likely to ${prediction}`;
            confidenceElement.textContent = confidence;

            const tone = { Graduate: 'success', Enrolled: 'warning', Dropout: 'danger' }[prediction];
            statusElement.classList.add(tone);
            confidenceElement.classList.add(tone);

            new Chart(document.getElementById('predictionChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: LABELS,
                    datasets: [{
                        label: 'Probability',
                        data: probabilities,
                        backgroundColor: COLORS,
                        borderWidth: 1,
                    }],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 1,
                            ticks: { callback: (value) => `${value * 100}%` },
                        },
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => `Probability: ${(context.raw * 100).toFixed(2)}%`,
                            },
                        },
                    },
                },
            });
        }
    </script>
</body>
</html>
